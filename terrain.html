<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Terrain — Herøy</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07090c; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 10px; left: 10px; z-index: 10;
      font: 12px ui-monospace, Consolas, monospace; color: #9fb4c7;
      background: rgba(0,0,0,.62); padding: 10px 12px; line-height: 1.7;
      border-left: 2px solid #c9a34e;
    }
    #hud b { color: #c9a34e; }
    input[type=range] { width: 150px; vertical-align: middle; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div><b>Herøy</b> — Kartverket DTM</div>
    <div id="stats">loading…</div>
    <div>hour <input id="hour" type="range" min="0" max="24" step="0.25" value="10"> <span id="hourv">10:00</span></div>
    <div>view <input id="view" type="range" min="0" max="4" step="1" value="0"> <span id="viewv">town</span></div>
    <div style="margin-top:6px;opacity:.7">drag orbit · wheel zoom</div>
  </div>
  <script type="module" src="/src/terrain-preview.js"></script>
</body>
</html>
